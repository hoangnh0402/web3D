# Toàn bộ hệ thống trên máy chủ local. Chạy từ gốc monorepo:
#   docker compose -f deploy/compose.yaml --env-file deploy/.env up -d --build
# Lần đầu, tạo tài khoản quản trị và dữ liệu ban đầu:
#   docker compose -f deploy/compose.yaml --env-file deploy/.env run --rm api npx prisma db seed
name: lab-fourt

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
  COOKIE_SECURE: 'true'
  LOG_LEVEL: ${LOG_LEVEL:-info}
  AI_PROVIDER: ${AI_PROVIDER:-mock}
  SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}

services:
  caddy:
    image: caddy:2.11.9
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    image: lab-fourt-web
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    image: lab-fourt-api
    restart: unless-stopped
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy

  # Cùng image với api, chỉ khác lệnh khởi động
  worker:
    image: lab-fourt-api
    restart: unless-stopped
    environment: *api-env
    command: ['node', 'dist/main.worker.js']
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:18.6
    restart: unless-stopped
    # Không mở cổng ra ngoài máy chủ (NFR-SEC-11)
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.9
    restart: unless-stopped
    # Chỉ mở trên chính máy chủ. Quản trị viên truy cập từ máy chủ hoặc qua SSH tunnel.
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      - kuma_data:/app/data

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  kuma_data:
