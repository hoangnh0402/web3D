<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1440" viewBox="0 0 390 1440"><rect width="390" height="1440" fill="#f1f5f4"/><g id="shell-32"><g id="page-27"><g id="stack-4"><g id="crumb-1"><text x="16" y="35" font-family="Be Vietnam Pro" font-size="13.5" font-weight="400" fill="#47606a" xml:space="preserve">‹</text><text x="24.55" y="35" font-family="Be Vietnam Pro" font-size="13.5" font-weight="400" fill="#47606a" xml:space="preserve">Thư viện ca</text></g><g id="grow-3"><text x="16" y="68.92" font-family="Bricolage Grotesque" font-size="24" font-weight="600" fill="#15323b" letter-spacing="-0.288" xml:space="preserve">Áp lực học tập</text><g id="sub-2"><text x="16" y="97.72" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#47606a" xml:space="preserve">Sinh viên năm hai chịu áp lực từ kết quả học tập</text><text x="16" y="120.97" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#47606a" xml:space="preserve">và kỳ vọng của gia đình.</text></g></g></g><g id="grid-2-26"><g id="stack-15"><g id="panel-10"><rect x="16" y="149.22" width="358" height="240.44" rx="12" fill="#ffffff"/><rect x="16.5" y="149.72" width="357" height="239.44" rx="12" fill="none" stroke="#d5e0de" stroke-width="1"/><text x="37" y="188.22" font-family="Bricolage Grotesque" font-size="19" font-weight="600" fill="#15323b" letter-spacing="-0.095" xml:space="preserve">Bối cảnh</text><g id="p-5"><text x="37" y="223.91" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#15323b" xml:space="preserve">Hà Linh là sinh viên năm hai, gia đình ở quê</text><text x="37" y="247.16" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#15323b" xml:space="preserve">làm nông, là người đầu tiên trong nhà học</text><text x="37" y="270.41" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#15323b" xml:space="preserve">đại học. Kỳ vừa rồi Linh trượt hai môn và</text><text x="37" y="293.66" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#15323b" xml:space="preserve">chưa nói với ai.</text></g><g id="row-9"><g id="badge-6"><rect x="37" y="311.91" width="174.03" height="23.38" rx="11.69" fill="#dcedee"/><text x="46" y="327.91" font-family="Be Vietnam Pro" font-size="12.5" font-weight="500" fill="#0f4c57" xml:space="preserve">Thân chủ</text><text x="105.41" y="327.91" font-family="Be Vietnam Pro" font-size="12.5" font-weight="500" fill="#0f4c57" xml:space="preserve">Hà Linh</text><text x="151.39" y="327.91" font-family="Be Vietnam Pro" font-size="12.5" font-weight="500" fill="#0f4c57" xml:space="preserve">,</text><text x="158.23" y="327.91" font-family="Be Vietnam Pro" font-size="12.5" font-weight="500" fill="#0f4c57" xml:space="preserve">20</text><text x="177.86" y="327.91" font-family="Be Vietnam Pro" font-size="12.5" font-weight="500" fill="#0f4c57" xml:space="preserve">tuổi</text></g><g id="badge-7"><rect x="221.03" y="311.91" width="62.41" height="23.38" rx="11.69" fill="#e6eceb"/><text x="230.03" y="327.91" font-family="Be Vietnam Pro" font-size="12.5" font-weight="500" fill="#47606a" xml:space="preserve">Cơ bản</text></g><g id="badge-8"><rect x="37" y="345.28" width="116.3" height="23.38" rx="11.69" fill="#e6eceb"/><text x="46" y="361.28" font-family="Be Vietnam Pro" font-size="12.5" font-weight="500" fill="#47606a" xml:space="preserve">Khoảng</text><text x="96.5" y="361.28" font-family="Be Vietnam Pro" font-size="12.5" font-weight="500" fill="#47606a" xml:space="preserve">25</text><text x="115.91" y="361.28" font-family="Be Vietnam Pro" font-size="12.5" font-weight="500" fill="#47606a" xml:space="preserve">phút</text></g></g></g><g id="panel-12"><rect x="16" y="411.66" width="358" height="160.44" rx="12" fill="#ffffff"/><rect x="16.5" y="412.16" width="357" height="159.44" rx="12" fill="none" stroke="#d5e0de" stroke-width="1"/><text x="37" y="450.66" font-family="Bricolage Grotesque" font-size="19" font-weight="600" fill="#15323b" letter-spacing="-0.095" xml:space="preserve">Mục tiêu học tập</text><g id="clean-11"><text x="55" y="486.34" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#15323b" xml:space="preserve">Lắng nghe</text><text x="55" y="515.59" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#15323b" xml:space="preserve">Làm rõ vấn đề</text><text x="55" y="544.84" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#15323b" xml:space="preserve">Phản hồi cảm xúc</text></g></g><g id="panel-14"><rect x="16" y="594.09" width="358" height="194.94" rx="12" fill="#ffffff"/><rect x="16.5" y="594.59" width="357" height="193.94" rx="12" fill="none" stroke="#d5e0de" stroke-width="1"/><text x="37" y="633.09" font-family="Bricolage Grotesque" font-size="19" font-weight="600" fill="#15323b" letter-spacing="-0.095" xml:space="preserve">Vai trò của bạn</text><g id="p-13"><text x="37" y="668.78" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#15323b" xml:space="preserve">Bạn là người tham vấn trong buổi gặp đầu</text><text x="37" y="692.03" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#15323b" xml:space="preserve">tiên. Hãy lắng nghe, đặt câu hỏi và giúp</text><text x="37" y="715.28" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#15323b" xml:space="preserve">thân chủ tự làm rõ điều họ đang gặp phải.</text><text x="37" y="738.53" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#15323b" xml:space="preserve">Thân chủ có thể do dự hoặc chưa sẵn sàng</text><text x="37" y="761.78" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#15323b" xml:space="preserve">chia sẻ ngay.</text></g></g></g><g id="panel-25"><rect x="16" y="809.03" width="358" height="490.7" rx="12" fill="#ffffff"/><rect x="16.5" y="809.53" width="357" height="489.7" rx="12" fill="none" stroke="#d5e0de" stroke-width="1"/><text x="37" y="848.03" font-family="Bricolage Grotesque" font-size="19" font-weight="600" fill="#15323b" letter-spacing="-0.095" xml:space="preserve">Trước khi bắt đầu</text><g id="notice-17"><rect x="37" y="866.72" width="316" height="89.06" rx="8" fill="#f9ecd3"/><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6e4606" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="51" y="880.72"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg><g id="grow-16"><text x="79" y="893.72" font-family="Be Vietnam Pro" font-size="14" font-weight="400" fill="#6e4606" xml:space="preserve">Đây là môi trường mô phỏng phục vụ</text><text x="79" y="915.41" font-family="Be Vietnam Pro" font-size="14" font-weight="400" fill="#6e4606" xml:space="preserve">học tập. Thân chủ do AI đóng vai,</text><text x="79" y="937.09" font-family="Be Vietnam Pro" font-size="14" font-weight="400" fill="#6e4606" xml:space="preserve">không phải người thật.</text></g></g><g id="clean-21"><text x="55" y="982.78" font-family="Be Vietnam Pro" font-size="13" font-weight="400" fill="#15323b" xml:space="preserve">Bạn có thể nói qua micro hoặc nhập văn bản.</text><text x="55" y="1008.92" font-family="Be Vietnam Pro" font-size="13" font-weight="400" fill="#15323b" xml:space="preserve">Thân chủ trả lời bằng chữ trên màn hình.</text><g id="li-18"><text x="55" y="1035.06" font-family="Be Vietnam Pro" font-size="13" font-weight="400" fill="#15323b" xml:space="preserve">Hệ thống lưu lời nói của bạn dưới dạng văn</text><text x="55" y="1055.2" font-family="Be Vietnam Pro" font-size="13" font-weight="400" fill="#15323b" xml:space="preserve">bản, không lưu âm thanh.</text></g><g id="li-19"><text x="55" y="1081.34" font-family="Be Vietnam Pro" font-size="13" font-weight="400" fill="#15323b" xml:space="preserve">Bạn xem và xóa được phiên của mình trong 14</text><text x="55" y="1101.48" font-family="Be Vietnam Pro" font-size="13" font-weight="400" fill="#15323b" xml:space="preserve">ngày.</text></g><g id