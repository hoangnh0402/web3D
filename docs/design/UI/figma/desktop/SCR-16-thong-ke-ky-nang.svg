t="600" fill="#e4efef" xml:space="preserve">TH</text></g><g id="grow-11"><text x="66" y="848.06" font-family="Be Vietnam Pro" font-size="14" font-weight="500" fill="#e4efef" xml:space="preserve">TS. Lê Thu Hằng</text><text x="66" y="871.75" font-family="Be Vietnam Pro" font-size="12" font-weight="400" fill="#a2bec2" xml:space="preserve">Giảng viên</text></g><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#e4efef" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="204.5" y="847.03"><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg></g></g><g id="page-38"><g id="page-head-19"><g id="grow-15"><text x="294" y="59" font-family="Bricolage Grotesque" font-size="31" font-weight="600" fill="#15323b" letter-spacing="-0.372" xml:space="preserve">Thống kê kỹ năng</text><g id="sub-14"><text x="294" y="89.19" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#47606a" xml:space="preserve">Tham vấn K72, nhóm 1, 6 sinh viên, 8 phiên. Số liệu dùng để điều chỉnh định hướng giảng</text><text x="294" y="112.44" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#47606a" xml:space="preserve">dạy, không phải điểm học phần.</text></g></g><g id="row-18"><g id="btn-16"><rect x="1081.16" y="78.69" width="177.66" height="40" rx="8" fill="#ffffff"/><rect x="1081.66" y="79.19" width="176.66" height="39" rx="8" fill="none" stroke="#b9c9c7" stroke-width="1"/><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#15323b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="1097.16" y="90.19"><path d="M3 9h18"/><path d="M9 3v18"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg><text x="1122.16" y="103.45" font-family="Be Vietnam Pro" font-size="14.5" font-weight="500" fill="#15323b" xml:space="preserve">Xem bảng số liệu</text></g><g id="btn-17"><rect x="1268.81" y="78.69" width="129.19" height="40" rx="8" fill="#ffffff"/><rect x="1269.31" y="7