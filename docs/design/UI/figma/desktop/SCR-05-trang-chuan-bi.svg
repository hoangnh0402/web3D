ter-spacing="-0.372" xml:space="preserve">Áp lực học tập</text><text x="294" y="116.11" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#47606a" xml:space="preserve">Sinh viên năm hai chịu áp lực từ kết quả học tập và kỳ vọng của gia đình.</text></g></g><g id="grid-2-35"><g id="stack-25"><g id="panel-20"><rect x="294" y="144.36" width="658.89" height="160.56" rx="12" fill="#ffffff"/><rect x="294.5" y="144.86" width="657.89" height="159.56" rx="12" fill="none" stroke="#d5e0de" stroke-width="1"/><text x="315" y="183.36" font-family="Bricolage Grotesque" font-size="19" font-weight="600" fill="#15323b" letter-spacing="-0.095" xml:space="preserve">Bối cảnh</text><g id="p-15"><text x="315" y="219.05" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#15323b" xml:space="preserve">Hà Linh là sinh viên năm hai, gia đình ở quê làm nông, là người đầu tiên trong nhà học</text><text x="315" y="242.3" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#15323b" xml:space="preserve">đại học. Kỳ vừa rồi Linh trượt hai môn và chưa nói với ai.</text></g><g id="row-19"><g id="badge-16"><rect x="315" y="260.55" width="174.03" height="23.38" rx="11.69" fill="#dcedee"/><text x="324" y="276.55" font-family="Be Vietnam Pro" font-size="12.5" font-weight="500" fill="#0f4c57" xml:space="preserve">Thân chủ</text><text x="383.41" y="276.55" font-family="Be Vietnam Pro" font-size="12.5" font-weight="500" fill="#0f4c57" xml:space="preserve">Hà Linh</text><text x="429.39" y="276.55" font-family="Be Vietnam Pro" font-size="12.5" font-weight="500" fill="#0f4c57" xml:space="preserve">,</text><text x="436.23" y="276.55" font-family="Be Vietnam Pro" font-size="12.5" font-weight="500" fill="#0f4c57" xml:space="preserve">20</text><text x="455.86" y="276.55" font-family="Be Vietnam Pro" font-size="12.5" font-weight="500" fill="#0f4c57" xml:space="preserve">tuổi</text></g><g id="badge-17"><rect x="499.03" y="260.55" width="62.41" height="23.38" rx="11.69" fill="#e6eceb"/><text x="508.03" y="276.55" font-family="Be Vietnam Pro" font-size="12.5" font-weight="500" fill="#47606a" xml:space="preserve">Cơ bản</text></g><g id="badge-18"><rect x="571.44" y="260.55" width="116.3" height="23.38" rx="11.69" fill="#e6eceb"/><text x="580.44" y="276.55" font-family="Be Vietnam Pro" font-size="12.5" font-weight="500" fill="#47606a" xml:space="preserve">Khoảng</text><text x="630.94" y="276.55" font-family="Be Vietnam Pro" font-size="12.5" font-weight="500" fill="#47606a" xml:space="preserve">25</text><text x="650.34" y="276.55" font-family="Be Vietnam Pro" font-size="12.5" font-weight="500" fill="#47606a" xml:space="preserve">phút</text></g></g></g><g id="panel-22"><rect x="294" y="326.92" width="658.89" height="160.44" rx="12" fill="#ffffff"/><rect x="294.5" y="327.42" width="657.89" height="159.44" rx="12" fill="none" stroke="#d5e0de" stroke-width="1"/><text x="315" y="365.92" font-family="Bricolage Grotesque" font-size="19" font-weight="600" fill="#15323b" letter-spacing="-0.095" xml:space="preserve">Mục tiêu học tập</text><g id="clean-21"><text x="333" y="401.61" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#15323b" xml:space="preserve">Lắng nghe</text><text x="333" y="430.86" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#15323b" xml:space="preserve">Làm rõ vấn đề</text><text x="333" y="460.11" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#15323b" xml:space="preserve">Phản hồi cảm xúc</text></g></g><g id="panel-24"><rect x="294" y="509.36" width="658.89" height="148.44" rx="12" fill="#ffffff"/><rect x="294.5" y="509.86" width="657.89" height="147.44" rx="12" fill="none" stroke="#d5e0de" stroke-width="1"/><text x="315" y="548.36" font-family="Bricolage Grotesque" font-size="19" font-weight="600" fill="#15323b" letter-spacing="-0.095" xml:space="preserve">Vai trò của bạn</text><g id="p-23"><text x="315" y="584.05" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#15323b" xml:space="preserve">Bạn là người tham vấn trong buổi gặp đầu tiên. Hãy lắng nghe, đặt câu hỏi và giúp</text><text x="315" y="607.3" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#15323b" xml:space="preserve">thân chủ tự làm rõ điều họ đang gặp phải. Thân chủ có thể do dự hoặc chưa sẵn</text><text x="315" y="630.55" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#15323b" xml:space="preserve">sàng chia sẻ ngay.</text></g></g></g><g id="panel-34"><rect x="972.89" y="144.36" width="425.11" height="428.73" rx="12" fill="#ffffff"/><rect x="973.39" y="144.86" width="424.11" height="427.73" rx="12" fill="none" stroke="#d5e0de" stroke-width="1"/><text x="993.89" y="183.36" font-family="Bricolage Grotesque" font-size="19" font-weight="600" fill="#15323b" letter-spacing="-0.095" xml:space="preserve">Trước khi bắt đầu</text><g id="notice-27"><rect x="993.89" y="202.05" width="383.11" height="67.38" rx="8" fill="#f9ecd3"/><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6e4606" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="1007.89" y="216.05"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg><g id="grow-26"><text x="1035.89" y="229.05" font-family="Be Vietnam Pro" font-size="14" font-weight="400" fill="#6e4606" xml:space="preserve">Đây là môi trường mô phỏng phục vụ học tập.</text><text x="1035.89" y="250.73" font-family="Be Vietnam Pro" font-size="14" font-weight="400" fill="#6e4606" xml:space="preserve">Thân chủ do AI đóng vai, không phải người thật.</text></g></g><g id="clean-30"><text x="1011.89" y="296.42" font-family="Be Vietnam Pro" font-size="13" font-weight="400" fill="#15323b" xml:space="preserve">Bạn có thể nói qua micro hoặc nhập văn bản.</text><text x="1011.89" y="322.56" font-family="Be Vietnam Pro" font-size="13" font-weight="400" fill="#15323b" xml:space="preserve">Thân chủ trả lời bằng chữ trên màn hình.</text><g id="li-28"><text x="1011.89" y="348.7" font-family="Be Vietnam Pro" font-size="13" font-weight="400" fill="#15323b" xml:space="preserve">Hệ thống lưu lời nói của bạn dưới dạng văn bản, không lưu</text><text x="1011.89" y="368.84" font-family="Be Vietnam Pro" font-size="13" font-weight="400" fill="#15323b" xml:space="preserve">âm thanh.</text></g><text x="1011.89" y="394.98" font-family="Be Vietnam Pro" font-size="13" font-weight="400" fill="#15323b" xml:space="preserve">Bạn xem và xóa được phiên của mình trong 14 ngày.</text><g id="li-29"><text x="1011.89" y="421.13" font-family="Be Vietnam Pro" font-size="13" font-weight="400" fill="#15323b" xml:space="preserve">Ca này thuộc</text><text x="1099.56" y="421.13" font-family="Be Vietnam Pro" font-size="13" font-weight="400" fill="#15323b" xml:space="preserve">Bài thực hành tuần 9</text><text x="1229.8" y="421.13" font-family="Be Vietnam Pro" font-size="13" font-weight="400" fill="#15323b" xml:space="preserve">, hạn</text><text x="1263.23" y="421.13" font-family="Be Vietnam Pro" font-size="13" font-weight="400" fill="#15323b" xml:space="preserve">05/11/2026</text><text x="1337.61" y="421.13" font-family="Be Vietnam Pro" font-size="13" font-weight="400" fill="#15323b" xml:space="preserve">.</text></g></g><g id="check-32"><g id="input-31"><rect x="993.89" y="440.27" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#B9C9C7"/></g><text x="1021.89" y="453.27" font-family="Be Vietnam Pro" font-size="14" font-weight="400" fill="#15323b" xml:space="preserve">Tôi đã đọc và hiểu quy tắc mô phỏng.</text></g><g id="btn-33"><rect x="993.89" y="471.95" width="383.11" height="48" rx="8" fill="#14606c" opacity="0.5"/><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="1119.78" y="487.45"><path d="M9 9.003a1 1 0 0 1 1.517-.859l4.997 2.997a1 1 0 0 1 0 1.718l-4.997 2.997A1 1 0 0 1 9 14.996z"/><circle cx="12" cy="12" r="10"/></svg><text x="1144.78" y="501.94" font-family="Be Vietnam Pro" font-size="15.5" font-weight="500" fill="#ffffff" xml:space="preserve">Bắt đầu phiên</text></g><text x="993.89" y="546.95" font-family="Be Vietnam Pro" font-size="13" font-weight="400" fill="#47606a" xml:space="preserve">Đánh dấu ô xác nhận để bắt đầu.</text></g></g></g></g></svg>